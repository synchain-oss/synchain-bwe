name: Setup gitleaks
description: Installs the gitleaks version pinned in .gitleaks-version to /usr/local/bin, checked against .gitleaks-sha256 (linux x64 runners only).

# Both scans use this, so the checks exist once. Updating gitleaks means changing both files, with the hash of
# gitleaks_<version>_linux_x64.tar.gz from that release's checksums file.
runs:
  using: composite
  steps:
    - name: Read and validate the pins
      shell: bash
      run: |
        v=$(tr -d '[:space:]' < .gitleaks-version)
        h=$(tr -d '[:space:]' < .gitleaks-sha256)
        # These strings go into a URL and a command, so their format is fixed before they are used.
        printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
          || { echo "::error::.gitleaks-version must be x.y.z"; exit 1; }
        printf '%s' "$h" | grep -qE '^[0-9a-f]{64}$' \
          || { echo "::error::.gitleaks-sha256 must be a SHA-256 in hex"; exit 1; }
        echo "GITLEAKS_VERSION=$v" >> "$GITHUB_ENV"
        echo "GITLEAKS_SHA256=$h" >> "$GITHUB_ENV"

    - name: Install gitleaks
      shell: bash
      run: |
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" -C /usr/local/bin gitleaks
        gitleaks version
